    <script>
      var bg = document.querySelector("#bg")
      var servers = document.querySelector("#servers")
      onresize = function(){
        let aspect = innerWidth / innerHeight
        let stack = innerHeight / 96
        var w = (stack*aspect)
        var h = stack
        w = innerWidth / w
        h = innerHeight / h
        bg.style.backgroundSize = w+"px " + h+"px"
      }
      onresize()

      let HTMLSafeSanitizer
      if(window.Sanitizer){
        HTMLSafeSanitizer = new Sanitizer({})
        HTMLSafeSanitizer.removeUnsafe()
      }
      let span = document.createElement("span")
      function formatSimple(str){
        if(span.setHTML) span.setHTML(str, HTMLSafeSanitizer)
        else span.textContent = str
        return span.innerHTML
      }

      function updateList(toUpdate){
        for(let v of toUpdate){
					if(!v.el){
						v.el = document.createElement("div")
						v.el.className = "server"
						servers.appendChild(v.el)
					}
					let html = ""
          if(!v.players && v.users) v.players = v.users
          if(v.thumbnail) html += "<img class='thumbnail' src='" + v.thumbnail + "'>"
          if((v.banned && typeof v.banned[username] === "string") || (v.whitelist && !v.whitelist.includes(username)) || v.multiplayerPass) html += "<div class='lockImg'></div>"
          html += "<b>"+formatSimple(v.name)+"</b><br>"
          if(v.host) html += "Hosted by "+v.host+"<br>"
          if(v.description) html += v.description+"<br>"
          html += v.players.length+" players online: "+v.players.join(", ")+"<br>"
          let i = 0
          for(let j in v.banned) i++
          if(i){
            html += i+" players banned: "
            for(let j in v.banned) html += formatSimple(j)+", "
            html = html.substring(0,html.length-2) + "<br>"
          }
          if(v.whitelist) html += v.whitelist.length+" players whitelisted: "+formatSimple(v.whitelist.join(", "))+"<br>"
          if(v.version) html += v.version+"<br>"
					v.el.innerHTML = html
        }
        players = 0
				for(let v of worlds){
          for(let i of v.players) if(i !== username) players++
				}
        document.title = worlds.length+" Servers, "+players+" Players. "+(usingUrl ? "From "+usingUrl : "")
      }
      
      var worlds, username, prevPlayers, players = 0
      let showingNotif = false
      function ondata(toUpdate){
        updateList(toUpdate)
        if(players>prevPlayers && Notification.permission === "granted" && !showingNotif){
          let n = new Notification('More people!', {
            body: 'There is now more people!'
          });
          showingNotif = true
          setTimeout(() => {n.close(); showingNotif = false}, 2000)
        }
        prevPlayers = players
        //worlds = data
      }

		let conns = []
		worlds = []
		let worldMap = {} // key: sigServer+"/"+id

		let sigStatus = {} // key -> {text, color}
		const sigstatusEl = document.getElementById("sigstatus")
		function updateStatus(){
			sigstatusEl.innerHTML = Object.entries(sigStatus)
				.map(([k,{text,color}])=>`<span style="color:${color}">${k}: ${text}</span>`)
				.join(" &middot; ")
		}

		function connectToServer(key, server){
      let closed
			let pingInterval
			sigStatus[key] = {text:"connecting", color:"gray"}
			updateStatus()
      function doPing(){
        conn.sendAll({type:"ping"})
      }
			let conn = server.connect({
				id: "viewer_"+Date.now().toString(36),
				onopen(){
					sigStatus[key] = {text:"connected", color:"lightgreen"}
					updateStatus()
					doPing()
					pingInterval = setInterval(doPing, 5000)
				},
				onmessage(data){
					if(data.type !== "pong" || !data.FROM) return
					let w = worldMap[data.FROM]
					if(!w){
						w = worldMap[data.FROM] = {el:null, players:[]}
						worlds.push(w)
					}
					Object.assign(w, data.data)
					w.seenPings = 2
					ondata([w])
				},
				onclose(){
					if(closed) return
					closed = true
					clearInterval(pingInterval)
					conns = conns.filter(c=>c!==conn)
					sigStatus[key] = {text:"disconnected", color:"orange"}
					updateStatus()
					setTimeout(()=>connectToServer(key, server), 5000)
				}
			})
			conns.push(conn)
		}

		function initServers(){
			for(let c of conns) c.close()
			conns = []
			for(let [key, server] of Object.entries(signalingServers)){
				connectToServer(key, server)
			}
			// Remove worlds that stopped responding
			setInterval(()=>{
				let now = Date.now()
				for(let w of worlds){
          w.seenPings--
          if(w.seenPings <= 0){
            w.el?.remove()
            worlds.splice(worlds.indexOf(w),1)
            for(let k in worldMap) if(worldMap[k]===w) delete worldMap[k]
          }
				}
				ondata([])
			}, 5000)
		}
		initServers()

      function notifyMe() {
        if (!window.Notification) {
