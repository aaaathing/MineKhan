<!DOCTYPE html>
<title>Untitled</title>
<base>
<style>button,a{border:none;display:block;padding:24px;margin:16px;cursor:pointer;}</style>
<a href="/">Home</a>
<button onclick="download('index.html','mk.html')">Download minekhan</button>
<button onclick="openAboutBlank()">Open minekhan with about:blank</button>
<button onclick="downloadThisPage()">Download this page (offdown.html)</button>
Copy it anywhere! (do give credit)
<br><br>
You can press Ctrl+H in minekhan to hide the page and Ctrl+J to show it again.<br><br>
<script>
  let base = document.baseURI||location.href
  async function download(href,download){
    //let data = await (await fetch("/minekhan")).arrayBuffer()
    //let version = (new TextDecoder().decode(data.slice(0,50))).match(/@[A-Za-z0-9 \.]*/)[0]
    let a = document.createElement("a")
    let str = await(await fetch(href)).text()
    str = str.replace("<base href>",'<base href="https://thingmaker.us.eu.org/minekhan/">')
    a.href = URL.createObjectURL(new Blob([str]))
    a.download = download
    a.click()
  }
  async function downloadThisPage(){
    let a = document.createElement("a")
    a.href = URL.createObjectURL(new Blob(["<!DOCTYPE html>"+document.documentElement.outerHTML.replace("<base>","<base href='"+base+"'>")]))
    a.download = "offdown.html"
    a.click()
  }
  addEventListener("error",e=>alert(e.message))
  function openAboutBlank(){
    const win = window.open("about:blank", "_blank");
    fetch("index.html").then(response => response.text()).then(html => {
      win.document.open();
      win.document.write(html);
      win.document.close();
    })
  }
</script>
